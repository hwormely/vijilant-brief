<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vijilant · Architecture Map</title>
<style>
  :root{
    /* App v5 light — canonical per H 2026-06-07 unification.
       Was dark-theme (#0F0F0F bg, near-white text). Now warm-bg #F4F6FA
       body, white panels, navy text. Cluster colors realigned to brand
       (teal=client, coral=route, navy=service, amber=db, purple=external,
       red=critical). DM Sans/Mono not loaded — staying self-contained per
       the architecture-map skill rules; system stack carries the weight. */
    --bg:#F4F6FA;       --panel:#FFFFFF;      --panel-2:#EEF1F7;
    --border:#D8DDED;   --text:#1B2A4A;       --muted:#6B7589;
    --client:#1A9E8A;   --route:#F4714F;      --service:#1B2A4A;
    --db:#E5A328;       --external:#8854A6;   --critical:#C0392B;
    --accent:#3ECFB2;   --accent-2:#F4714F;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    font-size:13px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
  header{position:fixed;top:0;left:0;right:0;height:54px;background:var(--panel);
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;
    padding:0 16px;z-index:10}
  header h1{font-size:14px;font-weight:600;margin:0;letter-spacing:.2px}
  header h1 .sub{color:var(--muted);font-weight:400;margin-left:8px;font-size:12px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:center}
  .chip{background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:5px 11px;border-radius:14px;cursor:pointer;font-size:12px;letter-spacing:.2px;
    transition:all .15s}
  .chip:hover{color:var(--text);border-color:var(--text)}
  .chip.active{background:var(--text);color:#fff;border-color:var(--text)}
  .chip.crit.active{background:var(--critical);color:#fff;border-color:var(--critical)}
  .chip.fix.active{background:var(--accent);color:#000;border-color:var(--accent)}
  .zoom{display:flex;gap:4px}
  .zoom button{background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:30px;height:28px;border-radius:5px;cursor:pointer;font-size:13px}
  .zoom button:hover{background:var(--border)}
  main{position:fixed;top:54px;left:0;right:380px;bottom:0;background:var(--bg);
    overflow:hidden;cursor:grab}
  main.dragging{cursor:grabbing}
  #viewport{transform-origin:0 0;will-change:transform}
  aside{position:fixed;top:54px;right:0;width:380px;bottom:0;background:var(--panel);
    border-left:1px solid var(--border);overflow-y:auto;padding:18px 18px 32px;
    font-size:13px}
  aside h2{font-size:13px;font-weight:600;margin:0 0 4px;letter-spacing:.2px}
  aside .pill{display:inline-block;font-size:10.5px;font-weight:500;letter-spacing:.4px;
    text-transform:uppercase;padding:2px 7px;border-radius:3px;margin-right:6px;
    background:var(--panel-2);color:var(--muted);border:1px solid var(--border)}
  aside .pill.crit{background:var(--critical);color:#fff;border-color:var(--critical)}
  aside h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;
    color:var(--muted);margin:18px 0 6px;border-bottom:1px solid var(--border);padding-bottom:6px}
  aside .path{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    font-size:11.5px;color:var(--accent);word-break:break-all;background:var(--panel-2);
    padding:6px 8px;border-radius:4px;border:1px solid var(--border);margin:6px 0}
  aside .role{color:var(--text);margin:6px 0;font-size:13px}
  aside .plain{color:var(--muted);font-size:12.5px;margin:6px 0;line-height:1.5}
  aside ul{margin:6px 0;padding-left:18px;color:var(--muted)}
  aside ul li{margin:4px 0;font-size:12px}
  aside .edge-item{display:block;color:var(--muted);font-size:12px;margin:3px 0;padding:3px 0;
    border-bottom:1px dashed var(--border)}
  aside .edge-item b{color:var(--text);font-weight:500}
  aside .fix-item{background:var(--panel-2);border-left:2px solid var(--accent);
    padding:6px 9px;margin:5px 0;font-size:12px;border-radius:0 3px 3px 0}
  aside .bug-item{background:var(--panel-2);border-left:2px solid var(--critical);
    padding:6px 9px;margin:5px 0;font-size:12px;border-radius:0 3px 3px 0}
  aside .bug-item .sev{font-size:10px;text-transform:uppercase;color:var(--critical);
    font-weight:600;letter-spacing:.4px;margin-right:6px}
  aside .surprise{background:var(--panel-2);border:1px solid var(--border);
    padding:9px 11px;margin:7px 0;border-radius:4px;font-size:12px}
  aside .surprise b{color:var(--accent)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px}

  /* SVG node + edge styling */
  svg{display:block;user-select:none}
  .cluster{fill:var(--panel-2);stroke:var(--border);stroke-width:1}
  .cluster-label{fill:var(--muted);font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.7px}
  .node rect{fill:var(--panel);stroke:var(--border);stroke-width:1.4;cursor:pointer;
    transition:filter .12s,stroke-width .12s}
  .node.color-client rect{stroke:var(--client)}
  .node.color-route rect{stroke:var(--route)}
  .node.color-service rect{stroke:var(--service)}
  .node.color-db rect{stroke:var(--db)}
  .node.color-external rect{stroke:var(--external)}
  .node.critical rect{stroke:var(--critical);stroke-width:2.2}
  .node text.lbl{fill:var(--text);font-size:12px;font-weight:600;pointer-events:none}
  .node text.sub{fill:var(--muted);font-size:11px;pointer-events:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .node text.dead{fill:var(--critical);font-size:10.5px;font-weight:600;letter-spacing:.4px;
    text-transform:uppercase;pointer-events:none}
  .node:hover rect{filter:drop-shadow(0 2px 8px rgba(27,42,74,.18))}
  .node.selected rect{stroke-width:2.4;filter:drop-shadow(0 4px 12px rgba(27,42,74,.25))}
  .node.dimmed{opacity:.22}

  .edge{fill:none;stroke:#C2CADC;stroke-width:1.1;pointer-events:none;
    transition:opacity .12s,stroke-width .12s}
  .edge.kind-critical{stroke:var(--critical);stroke-width:1.9}
  .edge.kind-api{stroke:var(--external);stroke-width:1.3}
  .edge.kind-db{stroke:var(--db);stroke-width:1.3}
  .edge.kind-mount{stroke:var(--client);stroke-width:1.1;stroke-dasharray:3 3}
  .edge.dimmed{opacity:.05}
  .edge-label{fill:var(--muted);font-size:10px;pointer-events:none;
    font-family:ui-monospace,Menlo,monospace}
  .edge-label.kind-critical{fill:var(--critical)}

  .badge{cursor:pointer}
  .badge circle{stroke:var(--bg);stroke-width:1.5}
  .badge text{font-size:9.5px;font-weight:700;fill:#000;pointer-events:none;text-anchor:middle}
  .badge.fix circle{fill:var(--accent)}
  .badge.bug circle{fill:var(--critical)}
  .badge.bug text{fill:#fff}
</style>
</head>
<body>

<header>
  <h1>Vijilant <span class="sub">~/vigilant · pnpm+turbo monorepo · architecture map</span></h1>
  <div class="chips" id="chips"></div>
  <div class="zoom">
    <button id="zoom-out" title="Zoom out">−</button>
    <button id="zoom-fit" title="Fit">⊡</button>
    <button id="zoom-in"  title="Zoom in">+</button>
  </div>
</header>

<main id="main">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr-normal"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2CADC"/></marker>
      <marker id="arr-critical" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
      <marker id="arr-api"      viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8854A6"/></marker>
      <marker id="arr-db"       viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5A328"/></marker>
      <marker id="arr-mount"    viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A9E8A"/></marker>
    </defs>
    <g id="viewport"></g>
  </svg>
</main>

<aside id="sidebar"></aside>

<script>
"use strict";

// ── Cluster boxes (left-to-right columns) ──────────────────────────────────────
const clusters = [
  { id: 'client',   label: 'Clients',                 x:   40, y:  10, w: 360, h: 2040 },
  { id: 'server',   label: 'API server entry',        x:  460, y:  10, w: 360, h: 2040 },
  { id: 'route',    label: 'Routes (/api/…)',          x:  880, y:  10, w: 380, h: 2040 },
  { id: 'service',  label: 'Services & lib',          x: 1320, y:  10, w: 360, h: 2040 },
  { id: 'db',       label: 'Data (Supabase)',         x: 1740, y:  10, w: 360, h: 2040 },
  { id: 'external', label: 'External services',       x: 2160, y:  10, w: 320, h: 2040 },
];

// ── Node factory + registry ───────────────────────────────────────────────────
const N = (id, cluster, label, sub, x, y, w, h, color, opts = {}) => ({
  id, cluster, label, sub, x, y, w, h, color, ...opts
});

// Helper geometry
const W = 290, H = 64;        // standard node footprint inside a 360-wide cluster
const Wn = 320, Hn = 70;      // larger node for route cluster (380 wide)
const G = 8;                  // vertical gap

// Column X positions:
const CX = { client: 55, server: 475, route: 910, service: 1335, db: 1755, external: 2175 };

let yClient = 60, yServer = 60, yRoute = 60, yLib = 60, yDb = 60, yExt = 60;
const next = (kind) => {
  switch(kind){
    case 'client':  { const y = yClient;  yClient  += H+G;  return y; }
    case 'server':  { const y = yServer;  yServer  += H+G;  return y; }
    case 'route':   { const y = yRoute;   yRoute   += Hn+G; return y; }
    case 'service': { const y = yLib;     yLib     += H+G;  return y; }
    case 'db':      { const y = yDb;      yDb      += H+G;  return y; }
    case 'external':{ const y = yExt;     yExt     += H+G;  return y; }
  }
};

const nodes = [
  // ─── CLIENTS ────────────────────────────────────────────────────────────────
  N('web-main','client','web · main.tsx','apps/web/src/main.tsx',
    CX.client, next('client'), W, H, 'client', {
    role:  'React + Vite app entry. Wires Honeybadger boundary, TanStack Query, i18next, listens to Supabase auth state.',
    plain: 'The starting point for the desktop web app. Boots React, plugs in error tracking, fetches the user profile + organization from Supabase the moment auth state lands.',
    path:  'apps/web/src/main.tsx:1-103',
    notes: ['line:32 onAuthStateChange — pre-warms API /health while loading profile','line:97 HoneybadgerErrorBoundary wraps the tree (web SDK works here)','line:91 HMR-safe — unsubscribes the auth listener'],
    tag:   ['overview','auth','web','all'],
  }),
  N('web-app','client','web · App.tsx','React Router v6 routes',
    CX.client, next('client'), W, H, 'client', {
    role:  'BrowserRouter with lazy-loaded pages, layered gates: ProtectedRoute → StaffOnlyGate / SurvivorOnlyGate → OrgStateGate (BAA + lifecycle) → Layout.',
    plain: 'The desktop routing tree. Decides what the user sees based on whether they are signed in, what role they have, and whether their organization has signed the HIPAA agreement.',
    path:  'apps/web/src/App.tsx:1-137',
    notes: ['line:84 ProtectedRoute parent','line:106 OrgStateGate — BAA + org lifecycle gate','line:101 PlatformAdminGate → /operator','line:87 SurvivorPortal renders OUTSIDE Layout (own chrome)','line:64 ResettingErrorBoundary resets per route'],
    tag:   ['overview','auth','web','billing','all'],
  }),
  N('web-supabase','client','web · supabase.ts','direct Supabase client (anon key)',
    CX.client, next('client'), W, H, 'client', {
    role:  'Anon-key Supabase client. Reads pass through RLS — most desktop reads bypass the API server.',
    plain: 'Lets the desktop talk directly to the database for reads. The database enforces who can see what via row-level security.',
    path:  'apps/web/src/lib/supabase.ts',
    notes: ['Anon key only — RLS-enforced on every query','Most page-level reads go here, not through the API'],
    tag:   ['overview','auth','web','db','all'],
  }),
  N('web-api','client','web · api.ts','fetch wrapper, Bearer → API',
    CX.client, next('client'), W, H, 'client', {
    role:  'Authed fetch helper. Attaches Supabase access_token; apiGet/apiPost/apiPatch/apiDownload for server-side mutations + exports.',
    plain: 'The bridge from the desktop to the Express server. Every server-only action (assessments, AI briefs, exports, billing) goes through here.',
    path:  'apps/web/src/lib/api.ts (464 lines)',
    notes: ['Bearer token from supabase.auth.getSession()','apiDownload streams .docx / .xlsx exports'],
    tag:   ['overview','auth','web','all'],
  }),
  N('web-auth-store','client','web · authStore.ts','zustand · session/profile/org',
    CX.client, next('client'), W, H, 'client', {
    role:  'In-memory auth slice: session, profile, organization, initializing flag.',
    plain: 'Holds who you are while you use the app — your account, your org, your role.',
    path:  'apps/web/src/store/authStore.ts',
    notes: ['initializing flag prevents premature redirects','setAuth + clearAuth are the only mutators'],
    tag:   ['auth','web','all'],
  }),

  N('mobile-layout','client','mobile · _layout.tsx','Expo Router root',
    CX.client, next('client'), W, H, 'client', {
    role:  'React Native entry. Boots a TanStack Query client with AES-256 encrypted AsyncStorage cache; key in expo-secure-store. Enforces a 30-min HIPAA idle logout.',
    plain: 'The starting point for the iOS/Android app. Sets up offline storage that is encrypted so PHI never sits in plain text on the phone, and signs the user out automatically after 30 minutes of no use.',
    path:  'apps/mobile/app/_layout.tsx:1-476',
    notes: ['line:69-71 CACHE_KEY_NAME / CACHE_STORAGE_KEY — encrypted persisted cache','line:74 IDLE_TIMEOUT_MS = 30 min (HIPAA §164.312(a)(2)(iii))','line:25-29 @honeybadger-io/js REMOVED — web SDK breaks RN; native SDK not installed → mobile is currently UNINSTRUMENTED','line:53 registerOfflineMutationDefaults → durable replay','line:86-97 5-sec timeout race so a hung native module doesn\'t blank-screen the app at boot'],
    tag:   ['overview','auth','mobile','offline','all'],
  }),
  N('mobile-api','client','mobile · api.ts','authed fetch wrapper',
    CX.client, next('client'), W, H, 'client', {
    role:  'apiGet / apiPost over fetch with Supabase Bearer token. Throws on missing session.',
    plain: 'The bridge from the phone to the Express server. Adds the user\'s auth token to every request.',
    path:  'apps/mobile/lib/api.ts:1-45',
    notes: ['Reads EXPO_PUBLIC_API_URL (Render: vigilant-qr89.onrender.com)','Throws "Not authenticated" if no session'],
    tag:   ['overview','mobile','all'],
  }),
  N('mobile-supabase','client','mobile · supabase.ts','RN-safe Supabase client',
    CX.client, next('client'), W, H, 'client', {
    role:  'Supabase client with AsyncStorage adapter + noopLock — works around RN\'s missing window/document/navigator.locks.',
    plain: 'Lets the phone app talk to the database directly. Several React Native-specific tweaks so supabase-js does not crash because the browser APIs it expects don\'t exist on a phone.',
    path:  'apps/mobile/lib/supabase.ts:1-39',
    notes: ['AsyncStorage adapter (sessions exceed SecureStore\'s 2KB key limit)','line:27 noopLock — RN is single-threaded, no cross-tab locks needed','EXPO_PUBLIC_SUPABASE_URL/ANON_KEY'],
    tag:   ['auth','mobile','db','all'],
  }),
  N('mobile-auth-store','client','mobile · authStore.ts','zustand · session/profile/org/role',
    CX.client, next('client'), W, H, 'client', {
    role:  'Auth slice for the phone. Adds activeRole for users with multi-role profiles.',
    plain: 'Holds the user\'s identity, organization, and the role they\'re currently acting as on the phone.',
    path:  'apps/mobile/store/authStore.ts:1-31',
    notes: ['permitted_roles enables admin-acts-as-CM via activeRole','clearAuth blanks everything on sign-out'],
    tag:   ['auth','mobile','all'],
  }),
  N('mobile-hooks','client','mobile · hooks/*','47 React-Query hooks',
    CX.client, next('client'), W, H, 'client', {
    role:  'Cataloged data hooks (useClients, useClient, useDashboard, useVJ, useNotifications, …). Most read direct from Supabase; mutations that need server logic (assessments, briefs, AI drafts, exports) go through lib/api.ts.',
    plain: 'A drawer of pre-built data fetchers for every screen — clients list, dashboard, messages, recovery plan, etc. Each one knows whether to hit the database directly or go through the server.',
    path:  'apps/mobile/hooks/ (47 files)',
    notes: ['Direct-to-Supabase: useClients, useClientNotes, useResources','Through-API: useDashboard, useVJ, useExportPdf, useSubmitAidApplication','useScrollToTopOnTabPress — double-tap-to-top UX, locked v5 detail'],
    tag:   ['overview','mobile','all'],
  }),

  N('survivor-portal-web','client','SurvivorPortal','/portal — own chrome',
    CX.client, next('client'), W, H, 'client', {
    role:  'Survivor self-service page. No Layout chrome. Lets a survivor see their case, message their CM, sign documents.',
    plain: 'The page a disaster survivor sees when they sign in — their case, their tasks, their messages with their case manager. Locked to their own data.',
    path:  'apps/web/src/pages/SurvivorPortal.tsx',
    notes: ['Gated by SurvivorOnlyGate (StaffOnlyGate would bounce a staff user to /)','RLS guarantees survivors only see their own thread'],
    tag:   ['survivor','web','messages','all'],
  }),

  // ─── API SERVER ENTRY ──────────────────────────────────────────────────────
  N('api-index','server','api · index.ts','Express 5 entry + mount table',
    CX.server, next('server'), W, H, 'service', {
    role:  'Express 5 server. helmet → CORS → STRIPE WEBHOOK (raw body, pre-rate-limit) → body parsers (varying size caps) → rate limiter → /api/* mounts → cron → error handlers.',
    plain: 'The Express server itself. Wires every URL prefix to its router, in a specific order that matters. Stripe\'s webhook must come first with the raw bytes for signature checking; big payloads (signatures, audio, gov-ID images) need their own caps before the global 50KB limit.',
    path:  'apps/api/src/index.ts:1-176',
    notes: ['line:44-46 fail-fast on missing env vars (SUPABASE_URL, ANTHROPIC_API_KEY, …)','line:65 Stripe webhook mounted with express.raw BEFORE rate limiter','line:71-79 body parser order: /intake/survivor 15MB, /signature-requests 2MB, /baa 2MB, /notation 25MB, then global 50KB','line:108-110 QUADRUPLE MOUNT on /api/clients — assessments + clients + briefs + aiDrafts','line:147-153 cron 0 8 * * * UTC — overdue follow-ups','line:160 Honeybadger error handler before our own catch-all'],
    tag:   ['overview','server','all'],
    critical: true,
  }),
  N('mw-requireAuth','server','middleware/auth.ts','requireAuth — JWT → org/role',
    CX.server, next('server'), W, H, 'service', {
    role:  'Validates the Bearer JWT via supabase.auth.getUser(), then loads the profile row (org_id, role, permitted_roles, is_active). Populates req.userId / orgId / userRole / permittedRoles / clientIp.',
    plain: 'The gatekeeper for every authenticated API call. Confirms the user\'s token is real, fetches their organization + role from the database, and attaches that info so every route handler knows who is calling.',
    path:  'apps/api/src/middleware/auth.ts:1-66',
    notes: ['Uses service-role supabase (bypasses RLS) — org filter still applied per-query downstream','503 deactivated-account check','permitted_roles enables multi-role users'],
    tag:   ['overview','auth','server','all'],
    critical: true,
  }),
  N('mw-platformAdmin','server','middleware/platformAdmin.ts','requirePlatformAdmin',
    CX.server, next('server'), W, H, 'service', {
    role:  'Cross-org gate. Checks platform_admins for the calling user; admits to /api/operator.',
    plain: 'A stricter gatekeeper that only lets the small number of Vijilant platform staff into the operator console — the place where orgs are provisioned, comped, and audited.',
    path:  'apps/api/src/middleware/platformAdmin.ts',
    notes: ['Used by routes/operator.ts','Joined to auth_is_platform_admin() in SQL (migration 047)'],
    tag:   ['platform','auth','server','all'],
  }),
  N('cron','server','node-cron · 8AM UTC','overdue follow-up emails',
    CX.server, next('server'), W, H, 'service', {
    role:  'Daily scheduled task. Calls sendOverdueNotifications() from routes/notifications.ts.',
    plain: 'Runs once a day at 8 AM UTC to email case managers about any overdue follow-ups.',
    path:  'apps/api/src/index.ts:147-153',
    notes: ['Only runs when CRON_SECRET is set','Honors notification_preferences.overdue_followup_emails'],
    tag:   ['notifications','server','all'],
  }),
  N('rate-limit','server','express-rate-limit','100 req/min/IP on /api',
    CX.server, next('server'), W, H, 'service', {
    role:  'Global /api/* limiter. Stripe webhook and public intake have their own (or skip).',
    plain: 'Stops any one IP from hammering the API. The webhook and public sign-up paths are exempt or have their own limits.',
    path:  'apps/api/src/index.ts:86-92',
    notes: ['Stripe webhook mounted BEFORE this — retries are never throttled','intake survivor: 5/IP/15min (own limiter)','leads: 10/IP/15min'],
    tag:   ['server','all'],
  }),

  // ─── ROUTES ─────────────────────────────────────────────────────────────────
  N('rt-clients','route','routes/clients.ts','970 lines · 14 endpoints',
    CX.route, next('route'), Wn, Hn, 'route', {
    role:  'The /api/clients monolith. POST · GET / · GET /archived · GET /:id · PATCH /:id · PATCH /:id/reassign · PATCH /:id/tier · POST /:id/notes · POST /:id/followups · PATCH /:id/followups/:fid/complete · POST /:id/goals · PATCH /:id/goals/:goalId · PATCH /:id/archive · PATCH /:id/unarchive.',
    plain: 'The single biggest file in the API. Everything you can do with a client other than running an assessment lives here — create, edit, assign, change priority, add notes, follow-ups, goals, and archive.',
    path:  'apps/api/src/routes/clients.ts (970 lines)',
    notes: ['Mounted on /api/clients ALONGSIDE assessments, briefs, aiDrafts','Returns assigned_cm_name (joined from profiles)','POST /:id/notes invalidates the brief cache','Worth a future split'],
    tag:   ['overview','clients','clients-core','all'],
    critical: true,
  }),
  N('rt-assessments','route','routes/assessments.ts','389 lines · the assessment seam',

const SVG_NS = 'http://www.w3.org/2000/svg';
const SVG = document.getElementById('svg');
const VP  = document.getElementById('viewport');

// Compute SVG size based on cluster extents
const SVG_W = clusters.reduce((m,c)=>Math.max(m, c.x+c.w), 0) + 40;
const SVG_H = clusters.reduce((m,c)=>Math.max(m, c.y+c.h), 0) + 40;
SVG.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);
SVG.setAttribute('width', SVG_W);
SVG.setAttribute('height', SVG_H);

// Index helpers
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));
const edgesByNode = nodes.reduce((m,n)=>{ m[n.id] = { in: [], out: [] }; return m; }, {});
edges.forEach(e => {
  if (!edgesByNode[e.from] || !edgesByNode[e.to]) { console.warn('edge refers to unknown node', e); return; }
  edgesByNode[e.from].out.push(e);
  edgesByNode[e.to].in.push(e);
});

// Render clusters
clusters.forEach(c => {
  const g = document.createElementNS(SVG_NS, 'g');
  const rect = document.createElementNS(SVG_NS, 'rect');
  rect.setAttribute('class','cluster');
  rect.setAttribute('x', c.x); rect.setAttribute('y', c.y);
  rect.setAttribute('width', c.w); rect.setAttribute('height', c.h);
  rect.setAttribute('rx', 8);
  g.appendChild(rect);
  const txt = document.createElementNS(SVG_NS, 'text');
  txt.setAttribute('class','cluster-label');
  txt.setAttribute('x', c.x + 18); txt.setAttribute('y', c.y + 28);
  txt.textContent = c.label;
  g.appendChild(txt);
  VP.appendChild(g);
});

// Render edges first (under nodes)
const edgesLayer = document.createElementNS(SVG_NS, 'g');
edgesLayer.setAttribute('id','edges');
VP.appendChild(edgesLayer);

function nodeAnchor(node, side) {
  // side: 'left' | 'right'
  return {
    x: side === 'left' ? node.x : node.x + node.w,
    y: node.y + node.h / 2,
  };
}

function edgePath(fromNode, toNode) {
  // Always exit on the side closer to destination
  const fromRight = (fromNode.x + fromNode.w / 2) < (toNode.x + toNode.w / 2);
  const a = nodeAnchor(fromNode, fromRight ? 'right' : 'left');
  const b = nodeAnchor(toNode,   fromRight ? 'left'  : 'right');
  const dx = Math.max(40, Math.abs(b.x - a.x) * 0.4);
  const c1x = fromRight ? a.x + dx : a.x - dx;
  const c2x = fromRight ? b.x - dx : b.x + dx;
  return `M ${a.x} ${a.y} C ${c1x} ${a.y}, ${c2x} ${b.y}, ${b.x} ${b.y}`;
}

edges.forEach((e, i) => {
  const f = nodeById[e.from], t = nodeById[e.to];
  if (!f || !t) return;
  const p = document.createElementNS(SVG_NS, 'path');
  p.setAttribute('class', `edge kind-${e.kind}`);
  p.setAttribute('d', edgePath(f, t));
  p.setAttribute('marker-end', `url(#arr-${e.kind})`);
  p.dataset.from = e.from; p.dataset.to = e.to; p.dataset.idx = String(i);
  e._el = p;
  edgesLayer.appendChild(p);

  // Edge label — only render when label is short enough and edge spans clusters
  if (e.label && Math.abs((t.x + t.w/2) - (f.x + f.w/2)) > 80) {
    const fromRight = (f.x + f.w/2) < (t.x + t.w/2);
    const a = nodeAnchor(f, fromRight ? 'right' : 'left');
    const b = nodeAnchor(t, fromRight ? 'left'  : 'right');
    // stagger by edge index in the same gutter so labels don't pile up
    const lbl = document.createElementNS(SVG_NS, 'text');
    lbl.setAttribute('class', `edge-label kind-${e.kind}`);
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2 + ((i % 5) - 2) * 6;
    lbl.setAttribute('x', mx); lbl.setAttribute('y', my);
    lbl.setAttribute('text-anchor','middle');
    lbl.textContent = e.label;
    e._lbl = lbl;
    edgesLayer.appendChild(lbl);
  }
});

// Render nodes
const nodesLayer = document.createElementNS(SVG_NS, 'g');
nodesLayer.setAttribute('id','nodes');
VP.appendChild(nodesLayer);

function truncate(s, max) {
  if (s.length <= max) return s;
  return s.slice(0, max - 1) + '…';
}

nodes.forEach(n => {
  const g = document.createElementNS(SVG_NS, 'g');
  g.setAttribute('class', `node color-${n.color}${n.critical ? ' critical' : ''}`);
  g.dataset.id = n.id;

  const rect = document.createElementNS(SVG_NS, 'rect');
  rect.setAttribute('x', n.x); rect.setAttribute('y', n.y);
  rect.setAttribute('width', n.w); rect.setAttribute('height', n.h);
  rect.setAttribute('rx', 6);
  g.appendChild(rect);

  const lbl = document.createElementNS(SVG_NS, 'text');
  lbl.setAttribute('class','lbl');
  lbl.setAttribute('x', n.x + 12);
  lbl.setAttribute('y', n.y + 22);
  lbl.textContent = truncate(n.label, 36);
  g.appendChild(lbl);

  if (n.sub) {
    const sub = document.createElementNS(SVG_NS, 'text');
    sub.setAttribute('class','sub');
    sub.setAttribute('x', n.x + 12);
    sub.setAttribute('y', n.y + 40);
    sub.textContent = truncate(n.sub, 44);
    g.appendChild(sub);
  }

  // Dead-code marker
  if ((n.tag||[]).includes('dead')) {
    const d = document.createElementNS(SVG_NS, 'text');
    d.setAttribute('class','dead');
    d.setAttribute('x', n.x + 12);
    d.setAttribute('y', n.y + n.h - 10);
    d.textContent = '⚠ schema / dead-code surface';
    g.appendChild(d);
  }

  // Fix + bug badges
  const fixCount = (FIXES[n.id] || []).length;
  const bugCount = (KNOWN_BUGS[n.id] || []).length;
  if (fixCount) {
    const b = document.createElementNS(SVG_NS, 'g');
    b.setAttribute('class','badge fix');
    const cx = n.x + n.w - 12 - (bugCount ? 22 : 0);
    const cy = n.y + 12;
    const c  = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', 8);
    b.appendChild(c);
    const tx = document.createElementNS(SVG_NS, 'text');
    tx.setAttribute('x', cx); tx.setAttribute('y', cy + 3);
    tx.textContent = String(fixCount);
    b.appendChild(tx);
    g.appendChild(b);
  }
  if (bugCount) {
    const b = document.createElementNS(SVG_NS, 'g');
    b.setAttribute('class','badge bug');
    const cx = n.x + n.w - 12;
    const cy = n.y + 12;
    const c  = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', 8);
    b.appendChild(c);
    const tx = document.createElementNS(SVG_NS, 'text');
    tx.setAttribute('x', cx); tx.setAttribute('y', cy + 3);
    tx.textContent = String(bugCount);
    b.appendChild(tx);
    g.appendChild(b);
  }

  n._el = g;
  nodesLayer.appendChild(g);

  g.addEventListener('mouseenter', () => { if (!selectedId) renderSidebar(n.id, true); });
  g.addEventListener('mouseleave', () => { if (!selectedId) renderDefaultSidebar(); });
  g.addEventListener('click', (ev) => { ev.stopPropagation(); selectNode(n.id); });
});

function applyFilter() {
  if (activeChip === 'fixes') {
    // Dim everything without a fix or bug
    nodes.forEach(n => {
      const has = (FIXES[n.id]?.length || 0) + (KNOWN_BUGS[n.id]?.length || 0);
      n._el.classList.toggle('dimmed', !has);
    });
    edges.forEach(e => e._el.classList.toggle('dimmed', true));
    edges.forEach(e => { if (e._lbl) e._lbl.style.display = 'none'; });
    return;
  }
  if (activeChip === 'all') {
    nodes.forEach(n => n._el.classList.remove('dimmed'));
    edges.forEach(e => e._el.classList.remove('dimmed'));
    edges.forEach(e => { if (e._lbl) e._lbl.style.display = ''; });
    return;
  }
  nodes.forEach(n => n._el.classList.toggle('dimmed', !(n.tag||[]).includes(activeChip)));
  edges.forEach(e => e._el.classList.toggle('dimmed', !(e.tag||[]).includes(activeChip)));
  edges.forEach(e => { if (e._lbl) e._lbl.style.display = (e.tag||[]).includes(activeChip) ? '' : 'none'; });
}

      // chips already manage dimming; don't override when "all"
    }
    x._el.classList.toggle('dimmed', !conn.has(x.id));
  });
  edges.forEach(e => {
    const on = e.from === id || e.to === id;
    e._el.classList.toggle('dimmed', !on);
    if (e._lbl) e._lbl.style.display = on ? '' : 'none';
  });

  const fixes = FIXES[id] || [];
  const bugs  = KNOWN_BUGS[id] || [];
  const ins   = edgesByNode[id]?.in  || [];
  const outs  = edgesByNode[id]?.out || [];

  sidebar.innerHTML = `
    <h2>
      ${n.critical ? '<span class="pill crit">CRITICAL</span>' : ''}
      <span class="pill">${n.cluster}</span>
      ${n.label}
    </h2>
    <div class="role">${n.role}</div>
    <div class="plain"><i>Plain English —</i> ${n.plain}</div>
    <div class="path">${n.path}</div>

    ${n.notes?.length ? `<h3>Notes</h3><ul>${n.notes.map(x=>`<li>${x}</li>`).join('')}</ul>` : ''}

    ${bugs.length  ? `<h3>Known bugs</h3>${bugs.map(b=>`<div class="bug-item"><span class="sev">${b.sev}</span>${b.t}</div>`).join('')}` : ''}
    ${fixes.length ? `<h3>Suggested fixes / roadmap</h3>${fixes.map(f=>`<div class="fix-item"><b>${f.n}.</b> ${f.t}</div>`).join('')}` : ''}

    ${ins.length ? `<h3>Incoming (${ins.length})</h3>${ins.map(e=>`<span class="edge-item"><b>${nodeById[e.from].label}</b> · <i>${e.kind}</i> · ${e.label||''}</span>`).join('')}` : ''}
    ${outs.length ? `<h3>Outgoing (${outs.length})</h3>${outs.map(e=>`<span class="edge-item"><b>→ ${nodeById[e.to].label}</b> · <i>${e.kind}</i> · ${e.label||''}</span>`).join('')}` : ''}
  `;
}

function selectNode(id) {
  if (selectedId === id) { // click again to deselect
    selectedId = null;
    nodes.forEach(x => x._el.classList.remove('selected'));
    applyFilter();
    renderDefaultSidebar();
    return;
  }
  renderSidebar(id, false);
}

// Click on background clears
document.getElementById('main').addEventListener('click', () => {
  selectedId = null;
  nodes.forEach(x => x._el.classList.remove('selected'));
  applyFilter();
  renderDefaultSidebar();
});

renderDefaultSidebar();

// ── Pan + zoom ────────────────────────────────────────────────────────────────
const main = document.getElementById('main');
let scale = 1, tx = 0, ty = 0;

function applyTransform() {
  VP.setAttribute('transform', `translate(${tx} ${ty}) scale(${scale})`);
}

function fit() {
  const rect = main.getBoundingClientRect();
  const sX = rect.width  / SVG_W;
  const sY = rect.height / SVG_H;
  scale = Math.min(sX, sY) * 0.95;
  tx = (rect.width  - SVG_W * scale) / 2;
  ty = (rect.height - SVG_H * scale) / 2;
  // Use the SVG width/height for the inner viewBox to react to scale
  SVG.style.width  = rect.width  + 'px';
  SVG.style.height = rect.height + 'px';
  SVG.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
  applyTransform();
}

window.addEventListener('resize', fit);

let dragging = false, dragX = 0, dragY = 0;
main.addEventListener('mousedown', (ev) => {
  // ignore drag on nodes — keep click selection
  if (ev.target.closest('.node')) return;
  dragging = true; dragX = ev.clientX; dragY = ev.clientY;
  main.classList.add('dragging');
});
window.addEventListener('mouseup', () => { dragging = false; main.classList.remove('dragging'); });
window.addEventListener('mousemove', (ev) => {
  if (!dragging) return;
  tx += ev.clientX - dragX; ty += ev.clientY - dragY;
  dragX = ev.clientX; dragY = ev.clientY;
  applyTransform();
});

main.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const rect = main.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  const factor = ev.deltaY < 0 ? 1.1 : 1/1.1;
  const newScale = Math.max(0.1, Math.min(5, scale * factor));
  // Anchor zoom around cursor
  tx = mx - (mx - tx) * (newScale / scale);
  ty = my - (my - ty) * (newScale / scale);
  scale = newScale;
  applyTransform();
}, { passive: false });

document.getElementById('zoom-in').addEventListener('click',  () => { scale *= 1.2; applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale /= 1.2; applyTransform(); });
document.getElementById('zoom-fit').addEventListener('click', fit);

fit();
</script>

</body>
