<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',-apple-system,sans-serif;background:linear-gradient(135deg,#1B2A4A 0%,#1F3D5C 40%,#1A6B6B 70%,#3ECFB2 100%);min-height:812px;display:flex;flex-direction:column;padding:60px 28px 48px;position:relative;overflow:hidden}</style>
</head>
<body>
<div style="position:absolute;width:280px;height:280px;border-radius:50%;background:#3ECFB2;filter:blur(80px);opacity:.22;top:-80px;right:-60px"></div>
<div style="position:absolute;width:180px;height:180px;border-radius:50%;background:#F4714F;filter:blur(70px);opacity:.14;bottom:60px;left:-50px"></div>
<div style="position:relative;z-index:1;margin-bottom:44px">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px">
    <div style="width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#3ECFB2,#F4714F);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(62,207,178,.4)"><span style="font-family:'DM Mono',monospace;font-size:15px;font-weight:500;color:white">Vj</span></div>
    <span style="font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:white">Vijilant</span>
  </div>
  <div style="font-size:26px;font-weight:700;color:white;margin-bottom:8px">Welcome back.</div>
  <div style="font-size:14px;color:rgba(255,255,255,.5)">Sign in to your account.</div>
</div>
<div style="display:flex;flex-direction:column;gap:13px;position:relative;z-index:1">
  <div>
    <div style="font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.45);margin-bottom:6px">Email</div>
    <div style="background:rgba(255,255,255,.1);border:1.5px solid #3ECFB2;border-radius:10px;padding:13px 14px;font-size:14px;color:white">hwormely@thelegacylandproject.org</div>
  </div>
  <div>
    <div style="font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.45);margin-bottom:6px">Password</div>
    <div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:13px 14px;font-size:14px;color:rgba(255,255,255,.35)">••••••••••••</div>
  </div>
  <div style="text-align:right;margin-top:-4px"><span style="font-size:12px;font-weight:600;color:#3ECFB2">Forgot password?</span></div>
  <div style="background:linear-gradient(135deg,#3ECFB2,#2ABFA4);border-radius:11px;padding:13px;text-align:center;font-size:14px;font-weight:700;color:#1B2A4A;box-shadow:0 5px 16px rgba(62,207,178,.28)">Sign In</div>
  <div style="display:flex;align-items:center;gap:10px"><div style="flex:1;height:1px;background:rgba(255,255,255,.1)"></div><span style="font-size:12px;color:rgba(255,255,255,.3)">or</span><div style="flex:1;height:1px;background:rgba(255,255,255,.1)"></div></div>
  <div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:12px;text-align:center;font-size:13px;font-weight:600;color:white">🔒 Sign in with SSO</div>
</div>
<div style="margin-top:auto;text-align:center;font-size:10px;color:rgba(255,255,255,.22);font-family:'DM Mono',monospace;padding-top:20px;position:relative;z-index:1">HIPAA COMPLIANT · WRMLY LLC</div>
</body>
</html>
